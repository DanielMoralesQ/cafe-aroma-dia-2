<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="horarios de atención">
    <title>Horarios de café Aroma</title>
</head>
<body>
    <table border="1">
        <caption>Horarios de atención de Café Aroma</caption>
        <thead>
            <tr>
                <th scope="col">Día</th>
                <th scope="col">Servicio</th>
                <th scope="col">Horario</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" scope="col">Lunes a Viernes</td>
                <td scope="col">Mañana</td>
                <td scope="col">7:00 AM. - 10:00 AM.</td>
            </tr>
            <tr>
                <td scope="col">Tarde</td>
                <td scope="col">12:00 PM. - 7:00 PM.</td>
            </tr>
            <tr>
                <td scope="col">Sábado</td>
                <td scope="col">jornada completa</td>
                <td scope="col">8:00 a. m. a 8:00 p. m.</td>
            </tr>
            <tr>
                <td scope="col">Domingo</td>
                <td scope="col">Mañana</td>
                <td scope="col">8:00 a. m. a 2:00 p. m.</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Cerramos los días festivos.</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
